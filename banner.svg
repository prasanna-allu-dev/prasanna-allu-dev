<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 196" width="880" height="196" role="img" aria-label="Studying computer science; US healthcare &amp; EDI; Food safety; Commercial real estate &amp; enterprise IT"><title>Studying computer science; US healthcare &amp; EDI; Food safety; Commercial real estate &amp; enterprise IT</title><style>
    svg {
      --ink:#0B131D; --ink-2:#46566A; --ink-3:#55647A;
      --panel:#FFFFFF;
      --paper:#FFFFFF;
      --era-1:#4A4FC4; --era-2:#0073BD; --era-3:#007F98; --era-4:#007A61; --era-5:#826314; --era-6:#BA671B;
      --line: var(--ink); --tone: var(--ink-3);
      --c1: var(--era-1); --c2: var(--era-3); --c3: var(--era-4);
      --c4: var(--era-6); --c5: var(--era-2);
    }
    text { font-family: ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }

    /* Idle loops, running once the route has drawn. */
    @keyframes blink { 0%,94%,100% { transform: scaleY(1) }
                        97% { transform: scaleY(.1) } }
    @keyframes bob { 0%,100% { transform: translateY(0) }
                      50% { transform: translateY(-4px) } }
    .blink { animation: blink 5.5s ease-in-out infinite;
              transform-origin: 45px 33px; }
    .bob { animation: bob 3.4s ease-in-out infinite; }

    /* The entrance. Every rule here animates FROM a hidden state to the
       element's own natural one, with fill-mode backwards - so the resting
       state in the stylesheet is the visible state. Hide-then-reveal would
       leave the whole banner blank for anyone whose renderer skips animation,
       which is the same trap the page audit checks for. */
    @keyframes wipe { from { transform: scaleX(0) } }
    @keyframes rise { from { opacity: 0; transform: translateY(9px) } }
    @keyframes fade { from { opacity: 0 } }

    .bd   { animation: wipe 1s linear backwards;
             transform-origin: left center; transform-box: fill-box; }
    .pr   { animation: rise .5s cubic-bezier(.2,.8,.3,1) backwards; }
    .lb   { animation: fade .6s ease-out backwards; }

    /* Motion off: everything is already in its resting state, so the only job
       is to stop the loops and drop the delays. */
    @media (prefers-reduced-motion: reduce) {
      .blink, .bob, .bd, .pr, .lb { animation: none }
    }
